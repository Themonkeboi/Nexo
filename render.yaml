services:
  - type: web
    name: nexo-v2
    runtime: node
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NEXO_DATA_DIR
        value: /var/data/nexo
    disk:
      name: nexo-data
      mountPath: /var/data
      sizeGB: 1
